name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy

      - name: clang-format
        run: find src/ tests/ -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

      - name: clang-tidy
        run: |
          cmake -S . -B build-tidy -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          clang-tidy -p build-tidy src/*.cpp

  build:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, macos-14]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev cmake g++

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install curl openssl cmake

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Unit Tests
        run: ./build/test_all

      - name: Google Tests
        run: ./build/gtest_all

      - name: Catch2 Tests
        run: ./build/catch2_all

      - name: CTest
        run: ctest --test-dir build --output-on-failure
